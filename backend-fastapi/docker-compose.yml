version: "3.9"

services:

  postgres:
    image: postgres:18
    container_name: hmzc_database
    environment:
      POSTGRES_USER: hmzc_user
      # Was a hardcoded literal ("password") — flagged in a security
      # review as a guessable default sitting on a published port. Read
      # from this directory's own .env instead (already gitignored —
      # see .env.example); the ":?" form fails loudly if it's missing.
      # Must match DATABASE_URL's password in the same .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend-fastapi/.env — see .env.example}
      POSTGRES_DB: hmzc_db
    # No ports: mapping — previously published 5432 to the host. The
    # backend container reaches it over the internal Docker network at
    # hostname "postgres" regardless; add `ports: ["5432:5432"]` back
    # temporarily if you need host-side psql/pgAdmin access.
    # postgres:18+ images store data using major-version-specific directory
    # names and expect the volume mounted one level up, at /var/lib/postgresql
    # (not .../data as prior versions did) - mounting at .../data makes the
    # image treat it as unexpected leftover data and refuse to start, even on
    # a brand-new empty volume. See https://github.com/docker-library/postgres/pull/1259
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    container_name: hmzc_backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - photo_uploads:/app/uploads

volumes:
  postgres_data:
  photo_uploads:
