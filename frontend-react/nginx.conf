server {
  listen ${PORT};

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy — lets the frontend call a relative /api path
  # instead of an absolute http://localhost:8000/api baked into the
  # build. An absolute localhost URL only works when the browser is on
  # the same machine as the backend; it breaks for anyone accessing this
  # container through a tunnel or a different host, since "localhost"
  # would resolve to *their* machine, not this one. "backend" resolves
  # via Docker's internal network — see docker-compose.yml.
  #
  # Only actually used locally (Docker Compose, where VITE_API_BASE_URL
  # is the relative "/api" from .env.production). On Railway, the
  # frontend is built with VITE_API_BASE_URL pointing at the backend's
  # own absolute URL instead (see Dockerfile's ARG), so browser requests
  # never hit this location block at all — but nginx still needs to be
  # ABLE to start, and "backend" doesn't exist as a hostname on Railway's
  # network. proxy_pass with a literal hostname makes nginx resolve and
  # validate it at startup (crash-looping immediately if it can't); using
  # a variable instead defers resolution to request time, so this stays
  # dead-but-harmless on Railway rather than crashing the whole container
  # for a route nothing ever calls there.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream_backend "http://backend:8000";
    # $request_uri (the full original path, e.g. "/api/health"), not a
    # static URI after the variable — a variable in proxy_pass disables
    # nginx's usual automatic "replace the matched location prefix"
    # rewriting, so appending a literal "/api/" here would have silently
    # forwarded every request as bare "/api/" regardless of what was
    # actually requested (caught by testing locally: the backend logged
    # every proxied request as GET /api/, never /api/health).
    proxy_pass $upstream_backend$request_uri;
    proxy_set_header Host $host;
  }

  # sw.js and the manifest must never be cached (by the browser or by an
  # edge proxy like Cloudflare) — a stale cached sw.js means the browser
  # never even sees the bytes needed to detect an update, so the service
  # worker (and anything it changed, like the app icons) silently never
  # updates for anyone. Everything else under /assets/ is fine to cache
  # aggressively since Vite fingerprints those filenames per build.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # index.html was the one thing in this file with no explicit
  # Cache-Control at all — everything under /assets/ is fine to cache
  # forever (Vite fingerprints those filenames per build), but index.html
  # is what *references* those fingerprinted filenames. Without this, a
  # browser (or the service worker's own network-first fetch() for
  # navigations — see public/sw.js) can still be served a cached, stale
  # index.html that points at an old JS bundle, so a deploy can go live
  # on the server while a returning visitor keeps silently running old
  # code indefinitely. Same fix already applied to sw.js/manifest.webmanifest
  # above, for the same reason.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
