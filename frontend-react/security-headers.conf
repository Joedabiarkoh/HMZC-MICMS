# Browser security headers for everything the frontend's own nginx serves
# (the app shell, JS/CSS, icons). Included from nginx.conf inside each
# location that serves files, NOT at server level: nginx drops every
# inherited add_header the moment a location sets one of its own (the
# Cache-Control ones in nginx.conf), so a server-level copy would silently
# vanish on exactly the files that matter most. Not included for /api/,
# whose responses already carry the backend's own headers.
#
# Content-Security-Policy, field by field (checked against what the app
# actually loads - see docs/ if this ever needs widening):
#   default-src 'self'      everything not listed below: same origin only
#   script-src 'self'       only the bundled JS; no inline scripts, no eval
#   style-src ... 'unsafe-inline'   React inline style props and the print
#                           stylesheet written at runtime need it
#   img-src ... data: blob: https:  QR codes, signatures, photos (data/blob)
#                           and certificate photos served by the API (https)
#   font-src 'self' data:
#   connect-src 'self' data: blob: https:  API calls (the Railway backend is
#                           https), Sentry, and the .docx exporter reading
#                           embedded images
#   worker-src/manifest-src 'self'   the offline service worker and manifest
#   object-src 'none', base-uri 'self', form-action 'self'
#   frame-ancestors 'none'  nobody can embed the app in a frame (clickjacking)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' data: blob: https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
